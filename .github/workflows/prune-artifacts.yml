name: Prune expired artifacts

# WHY THIS EXISTS
#
# Publishing this site runs GitHub's own `pages-build-deployment`, which
# uploads the built site as a `github-pages` artifact every time. One
# briefing a day is one artifact a day, about 30 MB each.
#
# They expire after a day, and expiring is not the same as being deleted:
# GitHub collects them on its own schedule and that schedule fell a month
# behind. On 24 Sept 2026 this repository was holding 29 expired artifacts,
# 799 MB of them, against an allowance of 500 MB that is shared by EVERY
# repository on the account. Nothing anywhere could upload an artifact any
# more, and the first thing to notice was an unrelated project's data sync
# going red with "Artifact storage quota has been hit".
#
# There is no workflow file behind the Pages build to put a retention on, so
# the only durable answer is to collect them here.
#
# IT CHECKS THAT IT CAN, BEFORE IT CLAIMS TO HAVE. The repository's default
# token scope is read, and a job that silently cannot delete is exactly how
# 799 MB accumulated unnoticed. The probe below asks GitHub to delete an
# artifact id that cannot exist: with the permission that answers 404, and
# without it, 403. A 403 fails the run and names the setting to change.

on:
  schedule:
    # 02:00 UTC, after the day's briefing has published.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check this job may actually delete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # `set -e` is on by default in a run block, and `gh api` exits
        # non-zero on any 4xx, so the status has to be captured in a
        # substitution that cannot fail or the step dies before it can say
        # what it learned. That is what the first version of this did.
        run: |
          out=$(gh api -X DELETE "repos/$GH_REPO/actions/artifacts/1" --include 2>&1 || true)
          code=$(printf '%s\n' "$out" | grep -m1 -oE 'HTTP/[0-9.]+ [0-9]{3}' | awk '{print $2}' || true)
          code=${code:-000}
          echo "GitHub answered $code to a delete of an artifact that cannot exist."
          if [ "$code" = "403" ]; then
            echo "::error title=No permission to delete artifacts::The token may read but not write Actions, so this job would find expired artifacts and remove none of them. Settings > Actions > General > Workflow permissions, set Read and write."
            exit 1
          fi
          if [ "$code" != "404" ]; then
            echo "::warning title=Unexpected answer::Expected 404 for a missing artifact, got $code. Pruning anyway; read the counts below."
          fi

      - name: Delete every artifact GitHub has expired but not collected
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --paginate \
            -q '.artifacts[] | select(.expired==true) | "\(.id) \(.size_in_bytes)"' > expired.txt
          found=$(wc -l < expired.txt | tr -d ' ')
          if [ "$found" = "0" ]; then
            echo "Nothing expired. Nothing to collect."
            echo "Nothing expired." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gone=0
          refused=0
          while read -r id _size; do
            if gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" --silent 2>/dev/null; then
              gone=$((gone + 1))
            else
              refused=$((refused + 1))
            fi
          done < expired.txt
          freed=$(awk '{s+=$2} END {printf "%.0f", s/1048576}' expired.txt)
          echo "Found $found expired, deleted $gone, refused $refused, about $freed MB."
          {
            echo "### Expired artifacts"
            echo
            echo "Found $found, deleted $gone, refused $refused. About $freed MB."
            echo
            echo "The allowance is 500 MB and is shared by every repository on this account."
          } >> "$GITHUB_STEP_SUMMARY"
          # A prune that found work and did none of it is the failure this
          # file exists to prevent, so it says so rather than passing.
          if [ "$refused" -gt 0 ]; then
            echo "::error title=Could not delete $refused artifacts::They still count against the shared 500 MB allowance."
            exit 1
          fi
